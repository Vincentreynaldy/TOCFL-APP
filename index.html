            {h:'電', p:'diàn', a:'Listrik/Elektronik'}, {h:'網', p:'wǎng', a:'Jaring/Net'}, {h:'房', p:'fáng', a:'Ruangan/Kamar'},
            {h:'車', p:'chē', a:'Mobil/Kendaraan'}, {h:'吃', p:'chī', a:'Makan'}, {h:'喝', p:'hē', a:'Minum'}, 
            {h:'看', p:'kàn', a:'Melihat/Membaca'}, {h:'聽', p:'tīng', a:'Mendengar'}, {h:'說', p:'shuō', a:'Berbicara'}, 
            {h:'寫', p:'xiě', a:'Menulis'}, {h:'學', p:'xué', a:'Belajar'}, {h:'門', p:'mén', a:'Pintu'}
        ];

        // ---------------------------------------------------------
        // HELPER FUNCTIONS
        // ---------------------------------------------------------
        const getToneColor = (tone) => {
            switch(tone) {
                case 1: return 'text-blue-500';
                case 2: return 'text-green-500';
                case 3: return 'text-orange-500';
                case 4: return 'text-[#C0392B]'; 
                default: return 'text-gray-500';
            }
        };

        const getLevel = (xp) => {
            if (xp >= 601) return { n: '仙 (Sage)', c: 'text-purple-600', i: '🧙‍♂️' };
            if (xp >= 301) return { n: '鳳 (Phoenix)', c: 'text-[#D4AF37]', i: '🦅' };
            if (xp >= 101) return { n: '虎 (Tiger)', c: 'text-orange-600', i: '🐅' };
            return { n: '龍 (Dragon)', c: 'text-[#C0392B]', i: '🐉' };
        };

        // Simple robust CSV line parser handling basic quotes
        function parseCSVLine(text) {
            let ret = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    if (inQuote && text[i+1] === '"') { cur += '"'; i++; }
                    else { inQuote = !inQuote; }
                } else if (c === ',' && !inQuote) {
                    ret.push(cur.trim());
                    cur = '';
                } else {
                    cur += c;
                }
            }
            ret.push(cur.trim());
            return ret;
        }

        // ---------------------------------------------------------
        // MAIN APP COMPONENT
        // ---------------------------------------------------------
        function HanziLearnApp() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem('hanziState');
                return saved ? JSON.parse(saved) : {
                    name: 'Pelajar',
                    xp: 0,
                    streak: 1,
                    lastLogin: new Date().toDateString(),
                    progress: { flashcard: 0, reading: 0, listening: 0, speaking: 0, writing: 0 },
                    fcQueue: FLASHCARDS.map((_, i) => i),
                    readDone: [],
                    customVocab: [] // Tempat simpan kosa kata dari CSV
                };
            });

            // Handle Daily Streak
            useEffect(() => {
                const today = new Date().toDateString();
                if (state.lastLogin !== today) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    
                    let newStreak = state.streak;
                    if (state.lastLogin === yesterday.toDateString()) {
                        newStreak++;
                    } else {
                        newStreak = 1;
                    }
                    updateState({ streak: newStreak, lastLogin: today });
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('hanziState', JSON.stringify(state));
            }, [state]);

            const updateState = (updates) => setState(prev => ({ ...prev, ...updates }));
            
            const addXP = (amount, module) => {
                setState(prev => {
                    const nextProg = { ...prev.progress };
                    if (module && nextProg[module] < 100) {
                        nextProg[module] = Math.min(100, nextProg[module] + amount);
                    }
                    return { ...prev, xp: prev.xp + amount, progress: nextProg };
                });
            };

            // Gabungkan Flashcard default dengan kustom
            const allFlashcards = useMemo(() => {
                return [...FLASHCARDS, ...(state.customVocab || [])];
            }, [state.customVocab]);

            // Speaking pakai 40 kata (default + kustom)
            const speakingCards = useMemo(() => {
                return allFlashcards.slice(0, 40).map((o,i)=>({id:i,...o}));
            }, [allFlashcards]);

            const navItems = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard' },
                { id: 'flashcard', icon: 'layers', label: 'Flashcard' },
                { id: 'reading', icon: 'book-open', label: 'Reading' },
                { id: 'listening', icon: 'headphones', label: 'Listening' },
                { id: 'speaking', icon: 'mic', label: 'Speaking' },
                { id: 'writing', icon: 'pen-tool', label: 'Writing' },
                { id: 'settings', icon: 'settings', label: 'Pengaturan' }
            ];

            // ---------------------------------------------------------
            // 1. DASHBOARD
            // ---------------------------------------------------------
            const Dashboard = () => {
                const lvl = getLevel(state.xp);
                const wordOfTheDay = useMemo(() => allFlashcards[Math.floor(Math.random() * allFlashcards.length)], [allFlashcards]);

                const ProgressRing = ({ label, pct }) => (
                    <div className="flex flex-col items-center">
                        <div className="relative w-16 h-16 rounded-full bg-gray-200 flex items-center justify-center">
                            <svg className="w-full h-full absolute top-0 left-0" viewBox="0 0 36 36">
                                <path className="text-[#E0E0E0]" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path className="text-[#C0392B]" strokeWidth="3" strokeDasharray={`${pct}, 100`} stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <span className="text-xs font-bold font-sans">{Math.floor(pct)}%</span>
                        </div>
                        <span className="text-xs mt-2 text-gray-600 font-sans">{label}</span>
                    </div>
                );

                return (
                    <div className="p-4 md:p-8 space-y-6 max-w-5xl mx-auto animate-fade-in">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <div>
                                <h1 className="text-3xl font-serif-sc text-[#1A1A2E]">歡迎回來!</h1>
                                <p className="text-gray-500 mt-1">Selamat datang kembali, {state.name}!</p>
                            </div>
                            <div className="flex items-center gap-6 mt-4 md:mt-0">
                                <div className="text-center">
                                    <div className="flex items-center justify-center text-[#C0392B] font-bold text-xl">
                                        <Icon name="flame" className="w-6 h-6 mr-1" /> {state.streak}
                                    </div>
                                    <span className="text-xs text-gray-400">Hari Streak</span>
                                </div>
                                <div className="text-center">
                                    <div className={`font-bold text-xl ${lvl.c} flex items-center justify-center`}>
                                        <Icon name="award" className="w-6 h-6 mr-1" /> {state.xp}
                                    </div>
                                    <span className="text-xs text-gray-400">Total XP</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="text-lg font-bold text-[#1A1A2E] mb-4 border-b pb-2">Progress Belajar</h2>
                                    <div className="flex justify-around flex-wrap gap-4">
                                        <ProgressRing label="Flashcard" pct={state.progress.flashcard || 0} />
                                        <ProgressRing label="Reading" pct={state.progress.reading || 0} />
                                        <ProgressRing label="Listening" pct={state.progress.listening || 0} />
                                        <ProgressRing label="Speaking" pct={state.progress.speaking || 0} />
                                        <ProgressRing label="Writing" pct={state.progress.writing || 0} />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    {navItems.slice(1,5).map(it => (
                                        <button key={it.id} onClick={() => setActiveTab(it.id)} className="flex flex-col items-center justify-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:border-[#D4AF37] hover:shadow-md transition-all">
                                            <div className="text-[#C0392B] mb-2"><Icon name={it.icon} className="w-8 h-8"/></div>
                                            <span className="font-medium text-sm text-[#1A1A2E]">{it.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-[#1A1A2E] to-gray-900 rounded-xl shadow-lg p-6 text-white text-center relative overflow-hidden">
                                    <div className="absolute top-0 right-0 p-4 opacity-10">
                                        <span className="text-6xl font-serif-sc">學</span>
                                    </div>
                                    <h3 className="text-sm text-gray-300 tracking-widest uppercase mb-4">Level Anda</h3>
                                    <div className="text-6xl mb-2">{lvl.i}</div>
                                    <div className={`text-2xl font-bold ${lvl.c} drop-shadow-md`}>{lvl.n}</div>
                                    <p className="text-xs mt-4 text-gray-400">Kumpulkan XP untuk naik level!</p>
                                </div>

                                <div className="bg-[#FAFAFA] border border-[#D4AF37]/30 rounded-xl shadow-sm p-6 text-center">
                                    <h3 className="text-sm font-bold text-[#D4AF37] mb-4 uppercase tracking-wider">Kata Hari Ini</h3>
                                    <div className="text-6xl font-serif-sc text-[#1A1A2E] mb-2">{wordOfTheDay.h}</div>
                                    <div className={`text-lg font-bold mb-1 ${getToneColor(wordOfTheDay.t)}`}>{wordOfTheDay.p}</div>
                                    <div className="text-sm text-gray-600 italic">{wordOfTheDay.a}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // ---------------------------------------------------------
            // 2. FLASHCARD
            // ---------------------------------------------------------
            const FlashcardModule = () => {
                // Initialize local queue with global state, ensuring indices don't exceed current allFlashcards
                const [queue, setQueue] = useState(() => {
                    const validQueue = state.fcQueue.filter(i => i < allFlashcards.length);
                    return validQueue.length > 0 ? validQueue : [...Array(allFlashcards.length).keys()];
                });
                const [isFlipped, setIsFlipped] = useState(false);
                const [sessionStats, setSessionStats] = useState({ seen: 0, known: 0 });

                const currentIdx = queue[0];
                const card = allFlashcards[currentIdx];

                const nextCard = (know) => {
                    setIsFlipped(false);
                    setTimeout(() => {
                        const newQueue = [...queue];
                        const item = newQueue.shift();
                        if (!know) {
                            const insertIdx = Math.min(newQueue.length, Math.floor(Math.random() * 5) + 3);
                            newQueue.splice(insertIdx, 0, item);
                        } else {
                            addXP(5, 'flashcard');
                            updateState({ fcQueue: newQueue });
                        }
                        
                        if (newQueue.length === 0) {
                            alert("Selesai! Anda telah me-review semua kartu.");
                            setQueue([...Array(allFlashcards.length).keys()]);
                        } else {
                            setQueue(newQueue);
                        }
                        setSessionStats(s => ({ seen: s.seen + 1, known: s.known + (know ? 1 : 0) }));
                    }, 300);
                };

                return (
                    <div className="max-w-2xl mx-auto p-4 md:p-8 flex flex-col items-center min-h-[80vh]">
                        <div className="w-full flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
                            <div>
                                <h2 className="text-xl font-bold text-[#1A1A2E]">Flashcards</h2>
                                <p className="text-xs text-gray-500">Tersisa: {queue.length} kartu</p>
                            </div>
                            <div className="text-right">
                                <p className="text-sm font-bold text-[#C0392B]">Sesi Ini</p>
                                <p className="text-xs text-gray-500">Dilihat: {sessionStats.seen} | Tahu: {sessionStats.known}</p>
                            </div>
                        </div>

                        {card && (
                            <div className="w-full max-w-sm aspect-[3/4] perspective-1000 mb-8">
                                <div 
                                    className={`w-full h-full relative transition-transform duration-500 transform-style-3d cursor-pointer ${isFlipped ? 'rotate-y-180' : ''}`}
                                    onClick={() => setIsFlipped(!isFlipped)}
                                >
                                    {/* Front */}
                                    <div className="absolute w-full h-full backface-hidden bg-[#FAFAFA] rounded-2xl shadow-xl border-2 border-gray-100 flex flex-col items-center justify-center p-8 text-center">
                                        <span className="text-7xl md:text-8xl font-serif-sc text-[#1A1A2E]">{card.h}</span>
                                        <span className="mt-8 text-sm text-gray-400">Ketuk untuk membalik</span>
                                    </div>
                                    
                                    {/* Back */}
                                    <div className="absolute w-full h-full backface-hidden bg-white rounded-2xl shadow-xl border-2 border-[#D4AF37]/50 flex flex-col items-center justify-center p-6 md:p-8 text-center rotate-y-180">
                                        <span className="text-4xl md:text-5xl font-serif-sc text-[#1A1A2E] mb-4">{card.h}</span>
                                        <span className={`text-xl md:text-2xl font-bold mb-2 ${getToneColor(card.t)}`}>{card.p}</span>
                                        <span className="text-lg text-gray-700 font-medium mb-8">{card.a}</span>
                                        
                                        {(card.kh || card.ka) && (
                                            <div className="w-full bg-gray-50 p-4 rounded-lg text-left border border-gray-200">
                                                {card.kh && <p className="font-serif-sc text-lg text-[#1A1A2E] mb-1">{card.kh}</p>}
                                                {card.ka && <p className="text-sm text-gray-600 italic">{card.ka}</p>}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {isFlipped ? (
                            <div className="flex gap-4 w-full max-w-sm">
                                <button onClick={() => nextCard(false)} className="flex-1 py-4 bg-red-100 text-[#C0392B] rounded-xl font-bold hover:bg-red-200 transition">Tidak Tahu ✗</button>
                                <button onClick={() => nextCard(true)} className="flex-1 py-4 bg-green-100 text-green-700 rounded-xl font-bold hover:bg-green-200 transition">Tahu ✓</button>
                            </div>
                        ) : (
                            <div className="h-14"></div>
                        )}
                    </div>
                );
            };

            // ---------------------------------------------------------
            // 3. READING
            // ---------------------------------------------------------
            const ReadingModule = () => {
                const [selectedIdx, setSelectedIdx] = useState(0);
                const [mode, setMode] = useState('all');
                const [answers, setAnswers] = useState({});
                const [score, setScore] = useState(null);

                const text = READING_TEXTS[selectedIdx];
                const isDone = state.readDone.includes(text.id);

                const checkAnswers = () => {
                    let correct = 0;
                    text.qs.forEach((q, i) => { if(answers[i] === q.a) correct++; });
                    setScore(correct);
                    if (correct === text.qs.length && !isDone) {
                        addXP(15, 'reading');
                        updateState({ readDone: [...state.readDone, text.id] });
                    }
                };

                return (
                    <div className="max-w-5xl mx-auto p-4 md:p-8 flex flex-col md:flex-row gap-8">
                        <div className="w-full md:w-1/3 space-y-2 max-h-[80vh] overflow-y-auto pr-2">
                            <h3 className="font-bold text-gray-500 uppercase text-xs mb-4">Daftar Bacaan</h3>
                            {READING_TEXTS.map((t, idx) => (
                                <button 
                                    key={t.id} 
                                    onClick={() => { setSelectedIdx(idx); setAnswers({}); setScore(null); }}
                                    className={`w-full text-left p-4 rounded-xl border transition flex items-center justify-between
                                        ${selectedIdx === idx ? 'bg-white border-[#C0392B] shadow-md' : 'bg-gray-50 border-transparent hover:bg-white'}`}
                                >
                                    <div>
                                        <div className="text-xs text-[#D4AF37] font-bold mb-1">Level {t.lvl}</div>
                                        <div className="font-bold text-[#1A1A2E]">{t.title}</div>
                                    </div>
                                    {state.readDone.includes(t.id) && <Icon name="check" className="text-green-500 w-5 h-5" />}
                                </button>
                            ))}
                        </div>

                        <div className="w-full md:w-2/3 bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                            <div className="flex flex-col md:flex-row justify-between md:items-center mb-6 pb-4 border-b gap-4">
                                <h2 className="text-2xl font-bold">{text.title}</h2>
                                <div className="flex bg-gray-100 rounded-lg p-1 text-sm self-start">
                                    <button onClick={()=>setMode('hanzi')} className={`px-3 py-1 rounded-md ${mode==='hanzi'?'bg-white shadow text-[#C0392B] font-bold':''}`}>Hanzi</button>
                                    <button onClick={()=>setMode('pinyin')} className={`px-3 py-1 rounded-md ${mode==='pinyin'?'bg-white shadow text-[#C0392B] font-bold':''}`}>+Pinyin</button>
                                    <button onClick={()=>setMode('all')} className={`px-3 py-1 rounded-md ${mode==='all'?'bg-white shadow text-[#C0392B] font-bold':''}`}>Semua</button>
                                </div>
                            </div>

                            <div className="space-y-6 mb-12 min-h-[150px]">
                                <p className="text-3xl md:text-4xl font-serif-sc text-[#1A1A2E] leading-loose tracking-wide">{text.h}</p>
                                {(mode === 'pinyin' || mode === 'all') && <p className="text-lg text-blue-700 font-medium leading-relaxed">{text.p}</p>}
                                {mode === 'all' && <p className="text-md text-gray-600 italic border-l-4 border-[#D4AF37] pl-4 py-2 bg-yellow-50/50">{text.i}</p>}
                            </div>

                            <div className="bg-[#FAFAFA] p-4 md:p-6 rounded-xl border border-gray-200">
                                <h3 className="font-bold text-lg mb-4 flex items-center">
                                    <Icon name="award" className="w-5 h-5 mr-2 text-[#D4AF37]"/> Kuis Pemahaman
                                </h3>
                                {text.qs.map((q, i) => (
                                    <div key={i} className="mb-6">
                                        <p className="font-medium mb-3">{i+1}. {q.q}</p>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            {q.o.map((opt, optIdx) => {
                                                const isSelected = answers[i] === optIdx;
                                                const isCorrect = score !== null && q.a === optIdx;
                                                const isWrong = score !== null && isSelected && q.a !== optIdx;
                                                return (
                                                    <button 
                                                        key={optIdx}
                                                        onClick={() => score===null && setAnswers({...answers, [i]: optIdx})}
                                                        className={`p-3 rounded-lg border text-sm text-left transition
                                                            ${isSelected && score===null ? 'border-[#C0392B] bg-red-50 text-[#C0392B]' : 'border-gray-200 bg-white hover:border-gray-300'}
                                                            ${isCorrect ? 'border-green-500 bg-green-50 text-green-700 font-bold' : ''}
                                                            ${isWrong ? 'border-red-500 bg-red-50 text-red-700 line-through' : ''}
                                                        `}
                                                        disabled={score !== null}
                                                    >
                                                        {opt}
                                                    </button>
                                                )
                                            })}
                                        </div>
                                    </div>
                                ))}

                                {score === null ? (
                                    <button 
                                        onClick={checkAnswers} 
                                        disabled={Object.keys(answers).length < text.qs.length}
                                        className="w-full py-3 bg-[#1A1A2E] text-white rounded-xl font-bold disabled:opacity-50 mt-4 hover:bg-gray-800 transition"
                                    >
                                        Periksa Jawaban
                                    </button>
                                ) : (
                                    <div className={`p-4 rounded-xl text-center font-bold ${score === text.qs.length ? 'bg-green-100 text-green-800' : 'bg-orange-100 text-orange-800'}`}>
                                        Skor: {score} / {text.qs.length}
                                        {score === text.qs.length ? ' (Sempurna! +15 XP)' : ' (Belum sempurna, ulangi yuk)'}
                                        <button onClick={() => { setScore(null); setAnswers({}); }} className="block mx-auto mt-2 text-sm underline font-normal text-[#C0392B]">Ulangi Kuis</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            };

            // ---------------------------------------------------------
            // 4. LISTENING
            // ---------------------------------------------------------
            const ListeningModule = () => {
                const [qIdx, setQIdx] = useState(0);
                const [rate, setRate] = useState(1);
                const [selected, setSelected] = useState(null);
                const [result, setResult] = useState(null);
                const [orderAnswers, setOrderAnswers] = useState([]);

                const q = LISTENING[qIdx];
                
                const playAudio = useCallback(() => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const u = new SpeechSynthesisUtterance(q.h);
                        u.lang = 'zh-TW';
                        u.rate = rate;
                        window.speechSynthesis.speak(u);
                    } else {
                        alert("Browser Anda tidak mendukung Text-to-Speech.");
                    }
                }, [q, rate]);

                const handleSelect = (idx) => {
                    if(result) return;
                    setSelected(idx);
                    const isCorrect = idx === q.ans;
                    setResult(isCorrect);
                    if (isCorrect) addXP(10, 'listening');
                };

                const handleOrderSelect = (word) => {
                    if(result) return;
                    setOrderAnswers([...orderAnswers, word]);
                };

                const checkOrder = () => {
                    const isCorrect = orderAnswers.join('') === q.h;
                    setResult(isCorrect);
                    if (isCorrect) addXP(10, 'listening');
                };

                const nextQ = () => {
                    setResult(null); setSelected(null); setOrderAnswers([]);
                    setQIdx((prev) => (prev + 1) % LISTENING.length);
                };

                return (
                    <div className="max-w-2xl mx-auto p-4 md:p-8 flex flex-col items-center">
                        <div className="w-full bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
                            <div className="flex justify-between items-center mb-6">
                                <div className="bg-[#1A1A2E] text-white text-xs px-3 py-1 rounded-full uppercase tracking-wider font-bold">
                                    Tipe {q.type}
                                </div>
                                <div className="flex gap-2 bg-gray-100 p-1 rounded-lg">
                                    {[0.6, 1, 1.2].map(r => (
                                        <button key={r} onClick={()=>setRate(r)} className={`px-2 py-1 text-xs rounded ${rate===r?'bg-white shadow text-[#C0392B] font-bold':''}`}>{r}x</button>
                                    ))}
                                </div>
                            </div>

                            <div className="text-center py-12 flex flex-col items-center">
                                <button onClick={playAudio} className="w-20 h-20 bg-[#C0392B] rounded-full flex items-center justify-center text-white hover:scale-105 active:scale-95 transition shadow-lg mb-6">
                                    <Icon name="volume-2" className="w-10 h-10 ml-1" />
                                </button>
                                <p className="text-gray-500 text-sm">Dengarkan audio dan jawab pertanyaan</p>
                            </div>

                            <div className="mt-4 w-full">
                                {q.type === 'C' && (
                                    <div className="text-2xl font-serif-sc text-center mb-6 bg-gray-50 p-4 rounded-xl border">
                                        {q.h.replace(q.opts[q.ans], '___')}
                                    </div>
                                )}

                                {(q.type === 'A' || q.type === 'B' || q.type === 'C') && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {q.opts.map((opt, i) => {
                                            let stateClass = "bg-white hover:bg-gray-50 border-gray-200";
                                            if (result !== null) {
                                                if (i === q.ans) stateClass = "bg-green-100 border-green-500 text-green-800 font-bold";
                                                else if (i === selected) stateClass = "bg-red-100 border-red-500 text-red-800 line-through";
                                            } else if (selected === i) {
                                                stateClass = "bg-red-50 border-[#C0392B] text-[#C0392B]";
                                            }

                                            return (
                                                <button key={i} onClick={() => handleSelect(i)} disabled={result !== null} className={`p-4 border rounded-xl transition text-lg ${q.type==='A'?'font-serif-sc text-2xl':''} ${stateClass}`}>
                                                    {opt}
                                                </button>
                                            );
                                        })}
                                    </div>
                                )}

                                {q.type === 'D' && (
                                    <div className="w-full">
                                        <div className="min-h-16 flex flex-wrap gap-2 mb-4 p-4 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50">
                                            {orderAnswers.map((w,i) => <span key={i} className="px-4 py-2 bg-[#1A1A2E] text-white rounded shadow font-serif-sc text-xl">{w}</span>)}
                                        </div>
                                        <div className="flex flex-wrap gap-3 justify-center mb-6">
                                            {q.opts.filter(w => orderAnswers.filter(a=>a===w).length < q.opts.filter(a=>a===w).length).map((w,i) => (
                                                <button key={i} onClick={()=>handleOrderSelect(w)} disabled={result!==null} className="px-4 py-2 bg-white border border-gray-300 rounded shadow hover:border-[#C0392B] font-serif-sc text-xl">{w}</button>
                                            ))}
                                        </div>
                                        {result === null && <button onClick={checkOrder} disabled={orderAnswers.length !== q.opts.length} className="w-full py-3 bg-[#C0392B] text-white rounded-xl font-bold disabled:opacity-50">Cek Susunan</button>}
                                    </div>
                                )}
                            </div>

                            {result !== null && (
                                <div className={`mt-8 p-6 rounded-xl border w-full ${result ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                    <h4 className={`text-xl font-bold mb-2 flex items-center ${result ? 'text-green-700' : 'text-red-700'}`}>
                                        {result ? <><Icon name="check" className="mr-2"/> Tepat Sekali!</> : <><Icon name="x" className="mr-2"/> Kurang Tepat</>}
                                    </h4>
                                    <p className="text-gray-700 mb-1">Teks: <span className="font-serif-sc text-xl ml-1">{q.h}</span></p>
                                    <p className="text-gray-700 mb-1">Pinyin: <span className="text-blue-600 font-mono ml-1">{q.p}</span></p>
                                    <p className="text-gray-700">Arti: <span className="italic ml-1">{q.a}</span></p>
                                    <button onClick={nextQ} className="mt-4 w-full py-3 bg-white border border-gray-300 rounded-xl font-bold hover:bg-gray-50 transition flex items-center justify-center">
                                        Lanjut <Icon name="chevron-right" className="w-5 h-5 ml-2" />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ---------------------------------------------------------
            // 5. SPEAKING
            // ---------------------------------------------------------
            const SpeakingModule = () => {
                const [qIdx, setQIdx] = useState(0);
                const [isRecording, setIsRecording] = useState(false);
                const [transcript, setTranscript] = useState('');
                const [evalResult, setEvalResult] = useState(null);
                const [apiError, setApiError] = useState(false);
                const recognitionRef = useRef(null);

                const q = speakingCards[qIdx];

                useEffect(() => {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognition) {
                        recognitionRef.current = new SpeechRecognition();
                        recognitionRef.current.lang = 'zh-TW';
                        recognitionRef.current.continuous = false;
                        recognitionRef.current.interimResults = false;

                        recognitionRef.current.onresult = (event) => {
                            const res = event.results[0][0].transcript;
                            setTranscript(res);
                            evaluate(res);
                        };
                        recognitionRef.current.onerror = (e) => {
                            console.error(e);
                            setIsRecording(false);
                            if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
                                setApiError("Izin mikrofon ditolak atau layanan tidak tersedia.");
                            }
                        };
                        recognitionRef.current.onend = () => setIsRecording(false);
                    } else {
                        setApiError("Browser Anda tidak mendukung Web Speech API. Silakan gunakan Google Chrome/Edge, atau lakukan Self-Assessment.");
                    }
                }, [q]);

                const playAudio = () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const u = new SpeechSynthesisUtterance(q.h);
                        u.lang = 'zh-TW';
                        window.speechSynthesis.speak(u);
                    }
                };

                const toggleRecord = () => {
                    if (!recognitionRef.current) return;
                    if (isRecording) {
                        recognitionRef.current.stop();
                    } else {
                        setTranscript('');
                        setEvalResult(null);
                        try {
                            recognitionRef.current.start();
                            setIsRecording(true);
                        } catch(e) {
                            console.error(e);
                        }
                    }
                };

                const evaluate = (spoken) => {
                    const target = q.h;
                    let matches = 0;
                    const resultCharMap = target.split('').map(char => {
                        const isMatch = spoken.includes(char);
                        if (isMatch) matches++;
                        return { char, isMatch };
                    });
                    
                    const score = Math.round((matches / target.length) * 100);
                    setEvalResult({ score, chars: resultCharMap });
                    if (score >= 70) addXP(20, 'speaking');
                };

                const manualSuccess = () => {
                    addXP(20, 'speaking');
                    setQIdx((i) => (i + 1) % speakingCards.length);
                };

                if(!q) return <div className="p-8 text-center">Loading...</div>;

                return (
                    <div className="max-w-xl mx-auto p-4 md:p-8">
                        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border border-gray-100 flex flex-col items-center text-center">
                            <div className="w-full flex justify-between text-gray-400 text-sm mb-8">
                                <span>Frasa {qIdx + 1} / {speakingCards.length}</span>
                                <button onClick={()=>setQIdx((i)=> (i+1)%speakingCards.length)} className="hover:text-black">Lewati</button>
                            </div>

                            <div className="mb-12">
                                <h1 className="text-5xl md:text-6xl font-serif-sc text-[#1A1A2E] mb-6 tracking-widest">{q.h}</h1>
                                <p className={`text-2xl font-bold mb-2 ${getToneColor(q.t)}`}>{q.p}</p>
                                <p className="text-gray-500">{q.a}</p>
                            </div>

                            {apiError ? (
                                <div className="w-full bg-orange-50 border border-orange-200 p-4 rounded-xl mb-8">
                                    <p className="text-orange-800 text-sm mb-4">{apiError}</p>
                                    <div className="flex gap-2">
                                        <button onClick={playAudio} className="flex-1 py-3 bg-white border border-gray-300 rounded-lg font-bold flex items-center justify-center text-sm">
                                            <Icon name="volume-2" className="w-4 h-4 mr-2" /> Dengar
                                        </button>
                                        <button onClick={manualSuccess} className="flex-1 py-3 bg-green-600 text-white rounded-lg font-bold text-sm">
                                            Saya bisa ✓
                                        </button>
                                    </div>
                                </div>
                            ) : (
                                <div className="flex gap-4 w-full mb-12">
                                    <button onClick={playAudio} className="flex-1 py-4 bg-gray-100 hover:bg-gray-200 text-[#1A1A2E] rounded-2xl font-bold flex items-center justify-center transition">
                                        <Icon name="volume-2" className="w-5 h-5 mr-2" /> Dengar
                                    </button>
                                    <button onClick={toggleRecord} className={`flex-1 py-4 text-white rounded-2xl font-bold flex items-center justify-center transition shadow-md ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-[#C0392B] hover:bg-red-700'}`}>
                                        {isRecording ? <><Icon name="mic-off" className="w-5 h-5 mr-2" /> Stop</> : <><Icon name="mic" className="w-5 h-5 mr-2" /> Bicara</>}
                                    </button>
                                </div>
                            )}

                            {evalResult && !apiError && (
                                <div className={`w-full p-6 rounded-2xl border ${evalResult.score >= 70 ? 'bg-green-50 border-green-200' : 'bg-orange-50 border-orange-200'}`}>
                                    <div className="text-4xl mb-4 font-bold">
                                        {evalResult.score}%
                                    </div>
                                    <div className="flex justify-center gap-2 mb-4 font-serif-sc text-3xl">
                                        {evalResult.chars.map((c, i) => (
                                            <span key={i} className={c.isMatch ? 'text-green-600' : 'text-orange-500 opacity-50'}>{c.char}</span>
                                        ))}
                                    </div>
                                    <p className="text-sm text-gray-600 mb-6">
                                        Yang terdeteksi: <span className="italic">"{transcript}"</span>
                                    </p>
                                    
                                    {evalResult.score >= 70 ? (
                                        <button onClick={()=> { setEvalResult(null); setQIdx(i=>(i+1)%speakingCards.length); }} className="w-full py-3 bg-green-600 text-white rounded-xl font-bold hover:bg-green-700">Bagus! Lanjut</button>
                                    ) : (
                                        <button onClick={()=> setEvalResult(null)} className="w-full py-3 bg-orange-500 text-white rounded-xl font-bold hover:bg-orange-600">Coba Lagi</button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ---------------------------------------------------------
            // 6. WRITING
            // ---------------------------------------------------------
            const WritingModule = () => {
                const canvasRef = useRef(null);
                const containerRef = useRef(null);
                const [isDrawing, setIsDrawing] = useState(false);
                const [qIdx, setQIdx] = useState(0);
                const [mode, setMode] = useState('tracing');
                const [canvasSize, setCanvasSize] = useState(300);

                const char = WRITING[qIdx];

                const drawGrid = useCallback((ctx, w, h) => {
                    ctx.clearRect(0, 0, w, h);
                    ctx.fillStyle = "#FAFAFA";
                    ctx.fillRect(0, 0, w, h);
                    
                    ctx.strokeStyle = "#ffb3b3";
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    
                    ctx.beginPath();
                    ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h);
                    ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
                    ctx.moveTo(0, 0); ctx.lineTo(w, h);
                    ctx.moveTo(w, 0); ctx.lineTo(0, h);
                    ctx.stroke();
                    
                    ctx.strokeStyle = "#ff4d4d";
                    ctx.setLineDash([]);
                    ctx.lineWidth = 4;
                    ctx.strokeRect(0,0,w,h);

                    if (mode === 'tracing') {
                        ctx.fillStyle = "rgba(0,0,0,0.08)";
                        ctx.font = `${w * 0.75}px "Noto Serif SC", serif`;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(char.h, w/2, h/2 + (h*0.05)); 
                    }
                }, [char, mode]);

                useEffect(() => {
                    const updateSize = () => {
                        if(containerRef.current) {
                            const width = Math.min(containerRef.current.offsetWidth - 32, 400);
                            setCanvasSize(width);
                        }
                    };
                    updateSize();
                    window.addEventListener('resize', updateSize);
                    return () => window.removeEventListener('resize', updateSize);
                }, []);

                useEffect(() => {
                    if(canvasRef.current) {
                        const cvs = canvasRef.current;
                        const ctx = cvs.getContext('2d');
                        drawGrid(ctx, cvs.width, cvs.height);
                    }
                }, [qIdx, mode, canvasSize, drawGrid]);

                const getPos = (e) => {
                    const rect = canvasRef.current.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return { x: clientX - rect.left, y: clientY - rect.top };
                };

                const startDraw = (e) => {
                    e.preventDefault();
                    setIsDrawing(true);
                    const pos = getPos(e);
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                };

                const draw = (e) => {
                    e.preventDefault();
                    if (!isDrawing) return;
                    const pos = getPos(e);
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.lineTo(pos.x, pos.y);
                    ctx.strokeStyle = "#1A1A2E"; 
                    ctx.lineWidth = canvasSize * 0.03;
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.stroke();
                };

                const stopDraw = () => setIsDrawing(false);

                const clearCanvas = () => {
                    const cvs = canvasRef.current;
                    drawGrid(cvs.getContext('2d'), cvs.width, cvs.height);
                };

                const finishDraw = () => {
                    addXP(10, 'writing');
                    setQIdx((i) => (i + 1) % WRITING.length);
                    clearCanvas();
                };

                return (
                    <div className="max-w-4xl mx-auto p-4 md:p-8 flex flex-col md:flex-row gap-8 items-start">
                        <div className="w-full md:w-1/3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-6">
                            <div>
                                <h2 className="text-xl font-bold mb-4">Latihan Menulis</h2>
                                <div className="flex bg-gray-100 rounded-lg p-1 text-sm mb-6">
                                    <button onClick={()=>setMode('tracing')} className={`flex-1 py-2 rounded-md ${mode==='tracing'?'bg-white shadow text-[#C0392B] font-bold':''}`}>Tracing</button>
                                    <button onClick={()=>setMode('memory')} className={`flex-1 py-2 rounded-md ${mode==='memory'?'bg-white shadow text-[#C0392B] font-bold':''}`}>Memori</button>
                                </div>
                            </div>

                            <div className="text-center bg-[#FAFAFA] p-6 rounded-xl border border-gray-200">
                                <div className="text-sm text-gray-500 uppercase tracking-widest mb-2">Target</div>
                                {mode === 'tracing' ? (
                                    <div className="text-6xl font-serif-sc text-[#1A1A2E] mb-4">{char.h}</div>
                                ) : (
                                    <div className="text-6xl font-serif-sc text-gray-300 mb-4 blur-[3px] select-none">?</div>
                                )}
                                <div className="text-xl text-blue-600 font-bold mb-1">{char.p}</div>
                                <div className="text-gray-600">{char.a}</div>
                            </div>
                        </div>

                        <div className="w-full md:w-2/3 flex flex-col items-center" ref={containerRef}>
                            <canvas 
                                ref={canvasRef}
                                width={canvasSize}
                                height={canvasSize}
                                className="bg-white rounded-lg shadow-md touch-none cursor-crosshair border-4 border-[#FAFAFA]"
                                onMouseDown={startDraw} onMouseMove={draw} onMouseUp={stopDraw} onMouseLeave={stopDraw}
                                onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={stopDraw}
                            ></canvas>
                            
                            <div className="flex gap-4 mt-8 w-full" style={{ maxWidth: canvasSize }}>
                                <button onClick={clearCanvas} className="flex-1 py-3 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-xl font-bold flex justify-center items-center">
                                    <Icon name="refresh" className="w-5 h-5 mr-2" /> Hapus
                                </button>
                                <button onClick={finishDraw} className="flex-1 py-3 bg-[#1A1A2E] hover:bg-black text-white rounded-xl font-bold flex justify-center items-center shadow-lg">
                                    <Icon name="check" className="w-5 h-5 mr-2" /> Selesai
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            // ---------------------------------------------------------
            // 7. PENGATURAN & UPLOAD CSV
            // ---------------------------------------------------------
            const SettingsModule = () => {
                const [newName, setNewName] = useState(state.name);

                const handleSave = () => {
                    updateState({ name: newName });
                    alert("Pengaturan profil disimpan!");
                };

                const resetProgress = () => {
                    if(window.confirm("Yakin ingin menghapus semua progress? Ini tidak bisa dibatalkan.")) {
                        localStorage.removeItem('hanziState');
                        window.location.reload();
                    }
                };

                const downloadTemplate = () => {
                    const content = "Hanzi,Pinyin,Tone,Arti,ContohHanzi,ContohArti\n測試,cè shì,4,Ujian/Tes,這是一個測試,Ini adalah sebuah ujian\n朋友,péng yǒu,2,Teman,他是我的朋友,Dia adalah teman saya";
                    const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'template_kosa_kata.csv';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };

                const handleFileUpload = (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const text = evt.target.result;
                        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                        
                        const newCards = [];
                        for(let i = 1; i < lines.length; i++) { // Mulai dari 1 untuk lewati header
                            const cols = parseCSVLine(lines[i]);
                            if(cols.length >= 4 && cols[0]) {
                                newCards.push({
                                    h: cols[0],
                                    p: cols[1],
                                    t: parseInt(cols[2]) || 5, // Default netral
                                    a: cols[3],
                                    kh: cols[4] || '',
                                    ka: cols[5] || ''
                                });
                            }
                        }

                        if(newCards.length > 0) {
                            const currentVocab = state.customVocab || [];
                            const updatedVocab = [...currentVocab, ...newCards];
                            
                            // Tambahkan index kosa kata baru ke queue agar muncul di flashcard
                            const baseLen = FLASHCARDS.length + currentVocab.length;
                            const newIndices = newCards.map((_, i) => baseLen + i);
                            
                            updateState({ 
                                customVocab: updatedVocab,
                                fcQueue: [...state.fcQueue, ...newIndices]
                            });
                            
                            alert(`Berhasil menambahkan ${newCards.length} kosa kata baru ke Flashcard Anda!`);
                        } else {
                            alert("Format CSV tidak valid atau file kosong. Pastikan mengikuti format template.");
                        }
                    };
                    reader.readAsText(file);
                    e.target.value = ''; // Reset input
                };

                const clearCustomVocab = () => {
                    if(window.confirm("Hapus semua kosa kata kustom yang pernah Anda unggah?")) {
                        // Bersihkan dari queue
                        const originalLen = FLASHCARDS.length;
                        const cleanedQueue = state.fcQueue.filter(idx => idx < originalLen);
                        updateState({ customVocab: [], fcQueue: cleanedQueue });
                    }
                };

                return (
                    <div className="max-w-2xl mx-auto p-4 md:p-8 space-y-8 animate-fade-in">
                        
                        {/* Pengaturan Profil */}
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-2xl font-bold text-[#1A1A2E] mb-6 flex items-center">
                                <Icon name="settings" className="mr-2"/> Pengaturan Profil
                            </h2>
                            
                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Nama Pengguna</label>
                                    <input 
                                        type="text" 
                                        value={newName} 
                                        onChange={(e) => setNewName(e.target.value)}
                                        className="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:border-[#C0392B]"
                                    />
                                </div>
                                <button onClick={handleSave} className="w-full py-3 bg-[#C0392B] text-white rounded-xl font-bold hover:bg-red-700">Simpan Perubahan</button>
                            </div>
                        </div>

                        {/* Manajemen Kosa Kata Kustom */}
                        <div className="bg-blue-50 p-6 md:p-8 rounded-2xl border border-blue-200">
                            <h3 className="text-xl font-bold text-blue-800 mb-2 flex items-center">
                                <Icon name="upload" className="mr-2" /> Kosa Kata Sendiri (CSV)
                            </h3>
                            <p className="text-sm text-blue-700 mb-4">Tambahkan Flashcard Anda sendiri dengan mengunggah file CSV. (Jumlah saat ini: <b>{state.customVocab?.length || 0}</b> kata kustom)</p>
                            
                            <div className="flex flex-col sm:flex-row gap-4 mb-4">
                                <button onClick={downloadTemplate} className="flex-1 py-3 px-4 bg-white border border-blue-300 text-blue-700 rounded-xl hover:bg-blue-100 font-bold text-sm flex items-center justify-center transition">
                                    <Icon name="download" className="w-5 h-5 mr-2" /> Download Template
                                </button>
                                
                                <label className="flex-1 py-3 px-4 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-bold text-sm flex items-center justify-center cursor-pointer transition shadow-md">
                                    <Icon name="upload" className="w-5 h-5 mr-2" /> Upload CSV
                                    <input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
                                </label>
                            </div>

                            {state.customVocab && state.customVocab.length > 0 && (
                                <button onClick={clearCustomVocab} className="text-sm text-red-600 hover:text-red-800 flex items-center mt-6 p-2 rounded hover:bg-red-50 transition">
                                    <Icon name="trash" className="w-4 h-4 mr-1" /> Hapus Semua Kosa Kata Kustom
                                </button>
                            )}
                        </div>

                        {/* Zona Bahaya */}
                        <div className="bg-red-50 p-6 md:p-8 rounded-2xl border border-red-200">
                            <h3 className="text-xl font-bold text-red-800 mb-2">Zona Bahaya</h3>
                            <p className="text-sm text-red-600 mb-4">Menghapus progress akan mereset XP, Level, dan status semua modul kembali ke 0. Ini tidak akan menghapus Kosa Kata Kustom Anda.</p>
                            <button onClick={resetProgress} className="py-2 px-4 bg-white border border-red-300 text-red-700 rounded-lg hover:bg-red-100 font-bold text-sm">Reset Semua Progress</button>
                        </div>

                    </div>
                );
            };

            // ---------------------------------------------------------
            // RENDER UTAMA
            // ---------------------------------------------------------
            return (
                <div className="min-h-screen text-gray-900 flex flex-col md:flex-row">
                    {/* Mobile Nav Header */}
                    <div className="md:hidden bg-[#1A1A2E] text-white p-4 flex justify-between items-center sticky top-0 z-20 shadow-md">
                        <div className="font-serif-sc text-xl font-bold text-[#D4AF37]">HànZì Learn 漢字</div>
                        <button onClick={() => setSidebarOpen(!sidebarOpen)}><Icon name={sidebarOpen ? "x" : "menu"} className="w-6 h-6" /></button>
                    </div>

                    {/* Sidebar Navigation */}
                    <div className={`${sidebarOpen ? 'block' : 'hidden'} md:flex w-full md:w-64 bg-[#1A1A2E] text-gray-300 min-h-screen sticky top-0 z-10 flex-shrink-0 flex-col transition-all shadow-xl`}>
                        <div className="p-6 hidden md:block">
                            <h1 className="text-2xl font-serif-sc text-[#D4AF37] font-bold tracking-wider">HànZì Learn<br/><span className="text-sm text-white font-sans">漢字學習</span></h1>
                        </div>
                        
                        <nav className="mt-2 md:mt-4 flex-1">
                            {navItems.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }}
                                    className={`w-full flex items-center px-6 py-4 text-left transition-colors
                                        ${activeTab === item.id ? 'bg-[#C0392B] text-white border-r-4 border-[#D4AF37]' : 'hover:bg-gray-800 hover:text-white'}`}
                                >
                                    <Icon name={item.icon} className="w-5 h-5 mr-4" />
                                    <span className="font-medium">{item.label}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-6 border-t border-gray-800 bg-gray-900/50 hidden md:block">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-[#D4AF37] rounded-full flex items-center justify-center text-[#1A1A2E] font-bold text-xl uppercase">
                                    {state.name.charAt(0)}
                                </div>
                                <div>
                                    <div className="text-white font-bold text-sm">{state.name}</div>
                                    <div className="text-xs text-gray-400">XP: {state.xp} • Lvl: {getLevel(state.xp).i}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0 bg-gray-50/50">
                        <main className="flex-1 overflow-y-auto relative pb-20 md:pb-0">
                            {activeTab === 'dashboard' && <Dashboard />}
                            {activeTab === 'flashcard' && <FlashcardModule />}
                            {activeTab === 'reading' && <ReadingModule />}
                            {activeTab === 'listening' && <ListeningModule />}
                            {activeTab === 'speaking' && <SpeakingModule />}
                            {activeTab === 'writing' && <WritingModule />}
                            {activeTab === 'settings' && <SettingsModule />}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HanziLearnApp />);
    </script>
</body>
</html>
